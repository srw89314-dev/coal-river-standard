name: Private website quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test monthly reporting draft generator
        run: node tests/monthly-report.test.cjs
      - name: Check site pages and links
        run: python tests/check_pages.py
      - name: Check showroom links and CSP compatibility
        run: python tests/check_showroom.py
      - name: Test inquiry guidance and submission handling
        run: node --test tests/contact-guidance.test.cjs
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test responsive pages and inquiry flow in Chromium
        run: python tests/browser_qa.py
